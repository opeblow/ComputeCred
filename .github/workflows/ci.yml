name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / compile / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run contracts:compile

      - name: Typecheck (contracts + worker + web)
        run: npm run typecheck

      - name: Run contract test suite (credit policy)
        run: npm run contracts:test

      - name: Run worker tests
        run: npm run worker:test

      - name: Build web dashboard
        run: npm run web:build

      - name: Run one-command demo
        run: npm run demo | tail -n 30